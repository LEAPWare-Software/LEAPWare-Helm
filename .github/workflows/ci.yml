name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Unit / adapter / conformance tests
        run: python -m pytest -q

      - name: Vendor drift check (scripts/lwh_build.py --check)
        run: python scripts/lwh_build.py --check

      - name: Build vendor trees for validators
        run: python scripts/lwh_build.py

      - name: Validate Claude Code plugin
        run: python scripts/lwh_validate_claude_plugin.py

      - name: Validate Codex plugin
        run: python scripts/lwh_validate_codex_plugin.py

      - name: lwh-prefix (every user-facing entrypoint starts with lwh)
        run: python scripts/lwh_check_prefix.py

      - name: lwh-env-leak (no local-environment or private-project leak)
        run: python scripts/lwh_check_env_leak.py

      - name: lwh-no-instruction-dep (no CLAUDE.md/AGENTS.md runtime dependency)
        run: python scripts/lwh_check_no_instruction_dep.py

      - name: HANDOFF.md shape check
        run: python scripts/lwh_handoff.py --check

      - name: lwh-commit-identity (LEAPWare or an allow-listed bot only)
        if: github.event_name == 'pull_request'
        # github.event.pull_request.*.sha, not origin/<base>..HEAD: a
        # pull_request checkout's HEAD is the synthetic refs/pull/N/merge
        # commit, authored under the triggering GitHub App's own identity,
        # not a real commit on the PR branch -- checking that range flags
        # the App itself as an offending author on every PR run.
        run: >-
          python scripts/lwh_check_commit_identity.py
          --base ${{ github.event.pull_request.base.sha }}
          --head ${{ github.event.pull_request.head.sha }}

  lwh-portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run the Claude hook exactly as hooks.json declares it
        run: python scripts/lwh_check_hook_launch.py
